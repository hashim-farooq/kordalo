#cloud-config
# Template. Run scripts\setup-local.ps1 to produce cloud-init.generated.yaml with your SSH key,
# then paste that into Hetzner's "Cloud config" box when creating the server.
groups:
  - docker

users:
  - name: kordalo
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - __SSH_PUBLIC_KEY__

package_update: true
package_upgrade: true
packages:
  - ufw
  - fail2ban
  - unattended-upgrades
  - ca-certificates
  - curl
  - cron

write_files:
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
  - path: /etc/sysctl.d/99-kordalo.conf
    content: |
      vm.swappiness=10
      vm.overcommit_memory=1
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  # 4 GB swap as a safety net against out-of-memory crashes
  - fallocate -l 4G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - sysctl --system
  # Firewall: only SSH and web traffic
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 443/udp
  - ufw --force enable
  # Docker
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker fail2ban
  - systemctl restart ssh
  - timedatectl set-timezone UTC
